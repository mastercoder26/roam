services:
  - type: web
    name: roam-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roam-db
          property: connectionString
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

databases:
  - name: roam-db
    databaseName: roam
    user: roam
    plan: free
